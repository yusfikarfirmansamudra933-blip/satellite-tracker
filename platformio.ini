; Pelacak Satelit - ESP32 + GPS + 2x 28BYJ-48 (pan-tilt)
; Buka folder ini di VS Code (dengan extension PlatformIO IDE).

[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
lib_deps =
    hopperpop/Sgp4
    mikalhart/TinyGPSPlus

upload_speed = 921600
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
monitor_filters = esp32_exception_decoder
